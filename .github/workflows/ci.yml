name: ci
on:
  push:
    branches: [main]
  pull_request:

# UNTRUSTED-CLASS RUNNER POLICY: runs on GitHub-hosted ubuntu-latest only.
# Never on self-hosted VDS. See docs/runner-security.md.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"
      - name: install pinned deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: test suite
        run: python -m pytest tests/ -q
      - name: README drift check
        run: python scripts/check_readme_drift.py
      - name: CLI validate demo
        run: python cli/sabi.py validate examples/telegram-live-status
      - name: CLI test demo --matrix
        run: python cli/sabi.py test examples/telegram-live-status --matrix

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: secret scan
        run: |
          ! grep -rEn '(ghp_|gho_|sk-|AKIA|xox[bap]-|-----BEGIN [A-Z ]*PRIVATE KEY)' \
            --include='*.py' --include='*.md' --include='*.yaml' --include='*.json' \
            spec src cli schemas tests examples docs || exit 1
          echo "no secret shapes found"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check action SHA pins
        run: |
          python -m pip install pyyaml
          python scripts/check_action_pins.py
      - name: SBOM (pip freeze)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip freeze > sbom-pip-freeze.txt
      - name: upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom-pip-freeze.txt
